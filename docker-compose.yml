version: '3.8'

services:
  tubegrab:
    build: .
    container_name: tubegrab-web-auth
    # network_mode: host bypasses Podman's internal DNS (10.89.1.1) which cannot
    # resolve external domains. With host networking the container shares the
    # host's network stack and DNS, so yt-dlp can reach YouTube directly.
    # The `ports:` mapping is not needed with host networking — the server
    # binds to port 3000 on the host directly.
    network_mode: host
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BIND_HOST=127.0.0.1
      - AUTH_USERNAME=${AUTH_USERNAME:?AUTH_USERNAME is required}
      - AUTH_PASSWORD=${AUTH_PASSWORD:?AUTH_PASSWORD is required}
      - AUTH_REALM=${AUTH_REALM:-TubeGrab Protected}
      - DOWNLOAD_START_RATE_LIMIT_MAX=${DOWNLOAD_START_RATE_LIMIT_MAX:-60}
      - YTDLP_COOKIES=/app/cookies.txt
      - TRUST_PROXY=${TRUST_PROXY:-1}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
      - JOB_MAP_CAP=${JOB_MAP_CAP:-500}
      - MAX_DURATION_SECONDS=${MAX_DURATION_SECONDS:-}
      - MAX_FILESIZE_BYTES=${MAX_FILESIZE_BYTES:-}
    volumes:
      - downloads:/app/downloads
      - ./cookies.txt:/app/cookies.txt:ro
    restart: unless-stopped
    mem_limit: 1g

volumes:
  downloads:

